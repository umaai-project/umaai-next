# 复用 `umaai-cli` 的呈现件（样例面，pub 面不承诺稳定）。
[package]
name = "scenario-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "scenario"
path = "src/main.rs"

[dependencies]
scenario-core.workspace = true
umaai-core.workspace = true
umasim.workspace = true
