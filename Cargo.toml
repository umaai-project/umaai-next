[workspace]
resolver = "3"
members = [
    "crates/umaai-core",
    "crates/umasim",
    "crates/umaai",
    "crates/umaai-cli",
    "crates/umaai-tools",
    "crates/umaai-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# 内部 crate —— 单向依赖：cli → umaai → umasim → umaai-core
umaai-core = { path = "crates/umaai-core" }
umasim = { path = "crates/umasim" }
umaai = { path = "crates/umaai" }

# 轻量基础依赖（核心层仅允许此类；终端/计算/网络重依赖不得进入核心层）
# 版本按当前最新已发布版本钉下限（`cargo add` 不支持写 workspace 依赖，故直接登记）
anyhow = "1.0.104"
enum-iterator = "2.3.0"
hashbrown = { version = "0.17.1", features = ["serde"] }
int-enum = "1.2.0"
log = "0.4.34"
rand = { version = "0.9.5", features = ["serde", "std_rng"] }
rand_distr = { version = "0.5.1", features = ["serde"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = true
